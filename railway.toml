[build]
builder = "nixpacks"

[deploy]
startCommand = "playwright install chromium && streamlit run app.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[nixpacks]
aptPkgs = ["chromium", "chromium-driver", "libglib2.0-0", "libnss3", "libnspr4", "libdbus-1-3", "libatk1.0-0", "libatk-bridge2.0-0", "libexpat1", "libx11-6", "libxcomposite1", "libxdamage1", "libxext6", "libxfixes3", "libxrandr2", "libgbm1", "libxcb1", "libxkbcommon0", "libpango-1.0-0", "libcairo2", "libasound2"]
